<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="35%" stop-color="#0d1326"/>
      <stop offset="70%" stop-color="#181236"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <radialGradient id="meshGlowPurple" cx="15%" cy="25%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowCyan" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Card Gradients & Borders -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f5f3ff"/>
      <stop offset="65%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1.5" fill="#818cf8" fill-opacity="0.3"/>
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(6px); }
      }
      @keyframes floatSlow4 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .floating-pill-1 { animation: floatSlow1 7s ease-in-out infinite; }
      .floating-pill-2 { animation: floatSlow2 8.5s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow3 9s ease-in-out infinite; }
      .floating-pill-4 { animation: floatSlow4 7.5s ease-in-out infinite; }
      .pulsing-mesh {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .circuit-flow {
        stroke-dasharray: 8 6;
        animation: dashFlow 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGradient)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Pulsing Ambient Lights -->
  <circle cx="180" cy="110" r="280" fill="url(#meshGlowPurple)" class="pulsing-mesh"/>
  <circle cx="1020" cy="310" r="300" fill="url(#meshGlowCyan)" class="pulsing-mesh"/>
  <circle cx="600" cy="210" r="260" fill="url(#meshGlowCenter)" class="pulsing-mesh"/>

  <!-- Dynamic Flow & Circuit Lines in Background -->
  <g opacity="0.45">
    <path d="M 60 70 Q 320 20 600 70 T 1140 70" fill="none" stroke="#8b5cf6" stroke-width="1.8" class="circuit-flow"/>
    <path d="M 60 350 Q 300 400 600 350 T 1140 350" fill="none" stroke="#06b6d4" stroke-width="1.8" class="circuit-flow"/>
    <path d="M 120 180 C 260 260, 400 120, 600 200 C 800 280, 940 140, 1080 220" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="6 4" class="circuit-flow"/>
  </g>

  <!-- Floating Dynamic Peripheral Pill Cards (Away from Center Title) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(60, 42)">
    <rect width="210" height="42" rx="21" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="21" r="7" fill="#8b5cf6"/>
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff" letter-spacing="0.3">⚡ Agentic Workflows</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-2" transform="translate(920, 42)">
    <rect width="220" height="42" rx="21" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="21" r="7" fill="#38bdf8"/>
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e0f2fe" letter-spacing="0.3">🧠 Enterprise RAG &amp; Context</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-3" transform="translate(60, 335)">
    <rect width="225" height="42" rx="21" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="21" r="7" fill="#10b981"/>
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#d1fae5" letter-spacing="0.3">🔒 Sovereign &amp; Air-Gapped</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill-4" transform="translate(930, 335)">
    <rect width="210" height="42" rx="21" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="21" r="7" fill="#ec4899"/>
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fce7f3" letter-spacing="0.3">🌐 Multi-Model &amp; MCP</text>
  </g>

  <!-- CENTER FOREGROUND CONTENT (Protected Zone - Crisp and Prominent) -->
  <g filter="url(#softShadow)" text-anchor="middle">
    <!-- Top Category Eyebrow Badge -->
    <g transform="translate(600, 108)">
      <rect x="-165" y="-16" width="330" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="2">🤖 AWESOME GENERATIVE AI ASSISTANT</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#titleGradient)" letter-spacing="-1.2">Awesome Generative AI Assistant</text>

    <!-- Accent Divider Line -->
    <rect x="360" y="222" width="480" height="3" rx="1.5" fill="url(#accentLine)"/>

    <!-- Subtitle -->
    <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Curated Directory of Enterprise Copilots, Agentic AI Systems &amp; Sovereign Self-Hosted Platforms
    </text>

    <!-- Highlights Row -->
    <g transform="translate(600, 305)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#94a3b8">
      <text>
        <tspan fill="#a855f7">●</tspan><tspan fill="#e2e8f0"> Enterprise Copilots </tspan>
        <tspan dx="15" fill="#38bdf8">●</tspan><tspan fill="#e2e8f0"> Agentic Orchestration </tspan>
        <tspan dx="15" fill="#10b981">●</tspan><tspan fill="#e2e8f0"> Self-Hosted RAG </tspan>
        <tspan dx="15" fill="#f43f5e">●</tspan><tspan fill="#e2e8f0"> Model Context Protocol (MCP)</tspan>
      </text>
    </g>
  </g>
</svg>
